<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Health OS - Personal fitness & content analytics">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Health OS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Health OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">Health OS</h1>
        <span class="badge" id="dataStatus">Offline</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="refreshBtn" aria-label="Refresh data">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="app-main" id="appMain">
      <!-- Dashboard View -->
      <section class="view active" id="dashboardView" data-view="dashboard">
        <div class="section-card">
          <div class="section-head">
            <h2>Today</h2>
            <span class="date" id="todayDate"></span>
          </div>
          <div class="today-workout" id="todayWorkout">
            <div class="loading">Loading...</div>
          </div>
        </div>

        <div class="metrics-grid">
          <div class="metric-card">
            <span class="metric-value" id="weekWorkouts">0</span>
            <span class="metric-label">Workouts This Week</span>
          </div>
          <div class="metric-card">
            <span class="metric-value" id="streakDays">0</span>
            <span class="metric-label">Streak Days</span>
          </div>
          <div class="metric-card">
            <span class="metric-value" id="runningKm">0</span>
            <span class="metric-label">Running (km)</span>
          </div>
          <div class="metric-card">
            <span class="metric-value" id="avgRPE">0</span>
            <span class="metric-label">Avg RPE</span>
          </div>
        </div>

        <div class="section-card">
          <div class="section-head">
            <h2>Body Map</h2>
            <button class="btn-ghost btn-sm" id="openBodyMap">View Full Map</button>
          </div>
          <div class="body-map-mini" id="bodyMapMini">
            <div class="body-3d-container" id="body3dMini">
              <div class="body-3d-model" id="body3dModelMini"></div>
            </div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-head">
            <h2>Content Metrics</h2>
          </div>
          <div class="content-metrics">
            <div class="content-metric">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 12s0-3.4-.4-5c-.2-.9-.9-1.6-1.8-1.8C19.2 4.8 12 4.8 12 4.8s-7.2 0-8.8.4c-.9.2-1.6.9-1.8 1.8C1 8.6 1 12 1 12s0 3.4.4 5c.2.9.9 1.6 1.8 1.8 1.6.4 8.8.4 8.8.4s7.2 0 8.8-.4c.9-.2 1.6-.9 1.8-1.8.4-1.6.4-5 .4-5z"/><path d="M10 15.5v-7l6 3.5-6 3.5z" fill="#fff"/></svg>
              <div>
                <span class="content-value" id="ytSubs">0</span>
                <span class="content-label">YouTube Subs</span>
              </div>
            </div>
            <div class="content-metric">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
              <div>
                <span class="content-value" id="liFollowers">0</span>
                <span class="content-label">LinkedIn Followers</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Body Map View -->
      <section class="view" id="bodyMapView" data-view="bodymap">
        <div class="section-card full-height">
          <div class="section-head">
            <h2>Muscle Recovery Map</h2>
            <button class="btn-ghost btn-sm" id="closeBodyMap">Close</button>
          </div>
          <div class="body-map-container">
            <div class="body-3d-container" id="body3dFull">
              <div class="body-3d-model" id="body3dModelFull"></div>
            </div>
            <div class="body-map-legend" id="bodyMapLegend"></div>
          </div>
        </div>
      </section>

      <!-- Schedule View -->
      <section class="view" id="scheduleView" data-view="schedule">
        <div class="section-card">
          <div class="section-head">
            <h2>Weekly Schedule</h2>
          </div>
          <div class="schedule-grid" id="scheduleGrid"></div>
        </div>
      </section>

      <!-- Medical/Health View -->
      <section class="view" id="healthView" data-view="health">
        <div class="section-card">
          <div class="section-head">
            <h2>Health Profile</h2>
          </div>
          <div class="health-grid" id="healthGrid"></div>
        </div>
        <div class="section-card">
          <div class="section-head">
            <h2>Medical Notes</h2>
          </div>
          <div class="medical-notes" id="medicalNotes"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-view="dashboard" aria-label="Dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="bodymap" aria-label="Body Map">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>Body Map</span>
      </button>
      <button class="nav-item" data-view="schedule" aria-label="Schedule">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Schedule</span>
      </button>
      <button class="nav-item" data-view="health" aria-label="Health">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/><path d="M12 22v-5"/></svg>
        <span>Health</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        console.log('SW registered:', reg.scope);
      }).catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
