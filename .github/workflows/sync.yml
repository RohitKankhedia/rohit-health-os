name: Aggregate & Push Public Metrics
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    paths:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Generate schedule
        run: python scripts/generate_schedule.py

      - name: Aggregate analytics
        run: python scripts/aggregate_analytics.py

      - name: Compute public metrics
        run: python scripts/compute_public_metrics.py

      - name: Commit private repo changes
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config user.name "health-os-bot"
          git config user.email "bot@github.com"
          git remote set-url origin https://${PAT}@github.com/RohitKankhedia/rohit-health-os.git
          
          # Reset to remote main - discard any local commits
          git fetch origin main
          git reset --hard origin/main
          
          # Files already generated by scripts above
          git add data/schedule/current.json data/analytics/latest.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "🤖 Auto-update schedule & analytics"
          git push --force origin main

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: RohitKankhedia/rohitkankhediya.web
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          path: public_repo
          fetch-depth: 0

      - name: Copy public metrics
        run: |
          mkdir -p public_repo/data
          cp data/public_metrics.json public_repo/data/public_metrics.json

      - name: Commit public repo
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          cd public_repo
          git config user.name "health-os-bot"
          git config user.email "bot@github.com"
          git remote set-url origin https://${PUBLIC_REPO_PAT}@github.com/RohitKankhedia/rohitkankhediya.web.git
          
          git fetch origin main
          git reset --hard origin/main
          
          git add data/public_metrics.json
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "🤖 Update public metrics"
          git push --force origin main