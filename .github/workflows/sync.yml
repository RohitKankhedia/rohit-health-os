name: Aggregate & Push Public Metrics
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    paths:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Generate schedule
        run: python scripts/generate_schedule.py

      - name: Aggregate analytics
        run: python scripts/aggregate_analytics.py

      - name: Compute public metrics
        run: python scripts/compute_public_metrics.py

      - name: Commit private repo changes
        run: |
          git config user.name "health-os-bot"
          git config user.email "bot@github.com"
          git add data/schedule/current.json data/analytics/latest.json
          git commit -m "🤖 Auto-update schedule & analytics" || echo "No changes"
          git push

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: RohitKankhedia/rohitkankhediya.web
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          path: public_repo

      - name: Copy public metrics
        run: cp data/public_metrics.json public_repo/data/public_metrics.json

      - name: Commit public repo
        run: |
          cd public_repo
          git config user.name "health-os-bot"
          git config user.email "bot@github.com"
          git add data/public_metrics.json
          git commit -m "🤖 Update public metrics" || echo "No changes"
          git push